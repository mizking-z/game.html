<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クソ連打！奇跡のクソ卵と10000回叩かれたひよこ</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
            overflow: hidden;
            transition: background-color 1s ease;
        }
        #container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 20px;
            color: #ffeb3b;
            margin-bottom: 5px;
        }
        #counter {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }
        #egg-container {
            position: relative;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #egg {
            font-size: 120px;
            transition: transform 0.05s ease;
            display: inline-block;
        }
        #egg:active {
            transform: scale(0.9);
        }
        #message {
            height: 50px;
            color: #ffeb3b;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }
        /* モーダル共通スタイル */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.active {
            display: flex;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #chick-icon {
            font-size: 130px;
            margin: 10px 0;
            filter: drop-shadow(0 0 20px #fff);
        }
        .rare-SSR { color: #ffd700; text-shadow: 0 0 10px #ff0000; }
        .rare-SR { color: #c0c0c0; text-shadow: 0 0 5px #00ffff; }
        .rare-N { color: #ffffff; }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* 図鑑エリア */
        #collection-summary {
            margin-top: 15px;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
        
        /* 図鑑モーダル内のリスト */
        #zukan-list {
            width: 85%;
            max-height: 60vh;
            overflow-y: auto;
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            text-align: left;
            margin: 15px 0;
        }
        .zukan-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
            padding: 10px 0;
        }
        .zukan-item .icon { font-size: 40px; margin-right: 15px; width: 50px; text-align: center; }
        .zukan-item .info { flex-grow: 1; }
        .zukan-item .no { font-size: 12px; color: #888; font-weight: bold; }
        .zukan-item .name { font-weight: bold; font-size: 15px; margin: 2px 0; }
        .zukan-item .desc { font-size: 12px; color: #ccc; line-height: 1.3; }
        .zukan-unknown { color: #555; }
    </style>
</head>
<body>

<div id="container">
    <h1>クソ連打！奇跡のクソ卵と10000回叩かれたひよこ</h1>
    <div id="counter">TAP: <span id="count">0</span> / 10000</div>
    
    <div id="egg-container" onclick="tapEgg()">
        <div id="egg">🥚</div>
    </div>
    
    <div id="message">無心で叩け…！</div>

    <!-- 操作用ボタン類 -->
    <div style="margin-top: 5px;">
        <button onclick="addCount(100)" style="background:#555; font-size:12px; padding:5px 10px;">[デバッグ] +100タップ</button>
        <button onclick="clearSaveData()" style="background:#882222; font-size:12px; padding:5px 10px; margin-left: 5px;">全リセット</button>
    </div>

    <div id="collection-summary">
        <h3>図鑑達成率: <span id="col-count">0</span>/100</h3>
        <button onclick="openZukan()">📖 ひよこ図鑑を見る</button>
    </div>
</div>

<!-- 誕生モーダル（10000回達成時） -->
<div id="result-modal" class="modal">
    <h1 style="color:#ff0; font-size: 32px; margin: 0;">🎉 生 誕 🎉</h1>
    <div id="rarity-label" style="font-size: 22px; font-weight: bold; margin-top: 5px;"></div>
    <div id="chick-icon">🐥</div>
    <h2 id="chick-name" style="margin: 5px 0;">普通のひよこ</h2>
    <p id="chick-desc" style="color: #ccc; max-width: 85%; font-size: 14px; line-height: 1.4;"></p>
    <button onclick="resetGame()">次のクソ卵を温める</button>
</div>

<!-- 図鑑一覧モーダル -->
<div id="zukan-modal" class="modal">
    <h2 style="margin: 0; color: #ffeb3b;">🐥 ひよこ図鑑 🐥</h2>
    <div id="zukan-list"></div>
    <button onclick="closeZukan()">閉じる</button>
</div>

<script>
let count = 0;
const targetCount = 10000;
let audioCtx = null;
let bgmTimer = null;
let currentBgmStage = -1;

// 100種類のひよこデータベース生成
const chickTypes = generateChickDatabase();
let collection = new Set();

// ロード処理（ページ読み込み時）
window.onload = function() {
    loadGameData();
};

function generateChickDatabase() {
    const list = [];
    const prefixes = [
        "普通の", "光の", "闇の", "虚無の", "黄金の", "マッチョな", "メカ", "社畜", "宇宙", "虚弱な",
        "覚醒した", "たそがれの", "伝説の", "インテリ", "限界", "ニート", "爆音の", "透明な", "ダンディな", "社外取締役"
    ];
    const baseNames = ["ひよこ", "ピヨ", "トリ", "チキン", "フェニックス"];
    
    const personalityTraits = [
        "毎朝4時に起きて筋トレをしているが体型は変わらない。",
        "口癖は『まあ知らんけど』で議論をうやむやにする。",
        "夜中に自分の翼を見つめて深呼吸するのが日課である。",
        "キーボードの『Enter』キーだけやたら強く叩く。",
        "実は卵の殻の中にエアコンを完備していた。",
        "鳴き声が『ピヨ』ではなく『ソノ件デスガ』である。",
        "バッテリー残量が常に3%しかない次世代型ピヨ。",
        "連打された衝撃で自分が鶏だったか悩み始めた。",
        "プロテインを水なしで飲むストイックな性格。",
        "裏で株式投資をしており含み損に苦しんでいる。",
        "鳴き声の周波数が高すぎてコウモリにしか届かない。",
        "休日はカフェでノートPCを開き何もしない。",
        "抜け毛を集めて小さなクッションを作ろうとしている。",
        "『ピヨ』の発音に異常なこだわりを持っている。",
        "見つめると照れて卵に戻ろうとするシャイな奴。",
        "無課金勢の味方で期待されないと喜ぶ。",
        "太平洋を自力で泳ぎ渡る夢を持っている。",
        "連打してくれた指の温もりを生涯忘れない。",
        "悟りをひらいておりどんな扱いにも動じない。",
        "生まれた瞬間に『次回作にご期待ください』と言いかけた。"
    ];

    for (let i = 1; i <= 100; i++) {
        let rarity = "N";
        if (i > 70) rarity = "SR";
        if (i > 95) rarity = "SSR";
        
        let emoji = "🐥";
        if (rarity === "SR") emoji = "🐤";
        if (rarity === "SSR") emoji = "🐥✨";
        if (i === 100) emoji = "🦚";

        const name = i === 100 ? "神聖不死鳥ピヨ・ゴッド" : `${prefixes[i % prefixes.length]}${baseNames[i % baseNames.length]}`;
        const trait = personalityTraits[(i - 1) % personalityTraits.length];

        list.push({
            id: i,
            name: name,
            rarity: rarity,
            emoji: emoji,
            desc: trait
        });
    }
    return list;
}

// セーブ・ロード機能
function saveGameData() {
    const saveData = {
        count: count,
        collection: Array.from(collection)
    };
    localStorage.setItem("kuso_egg_save", JSON.stringify(saveData));
}

function loadGameData() {
    const dataStr = localStorage.getItem("kuso_egg_save");
    if (dataStr) {
        try {
            const data = JSON.parse(dataStr);
            count = data.count || 0;
            collection = new Set(data.collection || []);
        } catch(e) {
            console.error("セーブデータの読み込み失敗", e);
        }
    }
    document.getElementById("count").innerText = count;
    document.getElementById("col-count").innerText = collection.size;
    updateMilestoneMessage(count - 1, count);
}

function clearSaveData() {
    if (confirm("セーブデータを消去して最初からやり直しますか？")) {
        localStorage.removeItem("kuso_egg_save");
        location.reload();
    }
}

// Web Audio API
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        updateBGMStage();
    }
}

// 1000回ごとのBGM制御ロジック
function updateBGMStage() {
    if (!audioCtx) return;

    // 0~9000以上で10段階(0~9)のステージ計算
    let newStage = Math.floor(count / 1000);
    if (newStage > 9) newStage = 9;

    if (newStage !== currentBgmStage) {
        currentBgmStage = newStage;
        startBGMByStage(currentBgmStage);
    }
}

function startBGMByStage(stage) {
    if (bgmTimer) clearInterval(bgmTimer);
    
    // 背景色も9000回で変化
    if (stage >= 9) {
        document.body.style.backgroundColor = "#4a0000";
    } else {
        document.body.style.backgroundColor = "#222";
    }

    // 1000回ごとのスケール・テンポデータ
    const bgmConfigs = [
        { interval: 500, notes: [261.63, 293.66, 329.63, 349.23], wave: 'triangle' }, // 0~999: 低めのんびり
        { interval: 450, notes: [293.66, 329.63, 392.00, 440.00], wave: 'triangle' }, // 1000~: 少しテンポアップ
        { interval: 400, notes: [329.63, 392.00, 440.00, 523.25], wave: 'square' },   // 2000~: ピコピコ感増
        { interval: 350, notes: [392.00, 440.00, 523.25, 587.33], wave: 'square' },   // 3000~: 軽快
        { interval: 300, notes: [440.00, 523.25, 587.33, 659.25], wave: 'sawtooth' }, // 4000~: 激しさアップ
        { interval: 280, notes: [523.25, 587.33, 659.25, 783.99], wave: 'sawtooth' }, // 5000~: ハイスピード
        { interval: 250, notes: [659.25, 783.99, 880.00, 1046.50], wave: 'square' },  // 6000~: 高音ピコピコ
        { interval: 220, notes: [523.25, 659.25, 783.99, 1046.50], wave: 'sawtooth' },// 7000~: 疾走感
        { interval: 200, notes: [587.33, 659.25, 880.00, 1174.66], wave: 'sawtooth' },// 8000~: クライマックス前夜
    ];

    let step = 0;
    
    if (stage < 9) {
        const config = bgmConfigs[stage];
        bgmTimer = setInterval(() => {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = config.wave;
            osc.frequency.setValueAtTime(config.notes[step % config.notes.length], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (config.interval / 1000) * 0.8);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + (config.interval / 1000));
            step++;
        }, config.interval);
    } else {
        // 9000回超え：超壮大オーケストラ和音
        const chords = [
            [261.63, 329.63, 392.00, 523.25],
            [220.00, 261.63, 329.63, 440.00],
            [174.61, 220.00, 261.63, 349.23],
            [196.00, 246.94, 293.66, 392.00]
        ];
        bgmTimer = setInterval(() => {
            if (!audioCtx) return;
            const currentChord = chords[step % chords.length];
            currentChord.forEach(freq => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.75);
            });
            step++;
        }, 800);
    }
}

// タップ音
function playTapSound(freq = 400) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

// 節目効果音
function playMilestoneSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, index) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + index * 0.07);
        gain.gain.setValueAtTime(0.12, now + index * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.07 + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.07);
        osc.stop(now + index * 0.07 + 0.22);
    });
}

// ファンファーレ
function playFanfare() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
    notes.forEach((freq, index) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + index * 0.1);
        gain.gain.setValueAtTime(0.2, now + index * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.1);
        osc.stop(now + index * 0.1 + 0.55);
    });
}

function tapEgg() {
    initAudio();
    addCount(1);
}

function addCount(num) {
    const prevCount = count;
    count += num;
    if (count > targetCount) count = targetCount;
    document.getElementById("count").innerText = count;

    // セーブ保存
    saveGameData();

    // 1000回刻みのBGM変更チェック
    updateBGMStage();

    // メッセージの更新と節目判定
    const isMilestone = updateMilestoneMessage(prevCount, count);

    if (isMilestone) {
        playMilestoneSound();
    } else {
        playTapSound(300 + (count % 200));
    }

    if (count >= targetCount) {
        hatchChick();
    }
}

// 100回ごとのコメント辞書
const milestoneMessages = {
    100: "100回：ヒビが入った…？いや、ホコリだった。",

    500: "500回：卵「あ、そこ気持ちいいです」",
    600: "600回：指の関節が自己主張を始めてきた。",
    700: "700回：卵がわずかに左右に揺れた。気のせいかもしれない。",
    800: "800回：まだ8%しか温まっていないという絶望。",

    9900: "9900回：あと100タップ！息を呑め！"

// メッセージ更新処理
function updateMilestoneMessage(prev, current) {
    const msg = document.getElementById("message");
    const egg = document.getElementById("egg");
    let isHit = false;

    const prevHundred = Math.floor(prev / 100);
    const currHundred = Math.floor(current / 100);

    if (currHundred > prevHundred) {
        isHit = true;
    }

    const activeHundred = currHundred * 100;

    if (activeHundred > 0) {
        if (milestoneMessages[activeHundred]) {
            msg.innerText = milestoneMessages[activeHundred];
        } else {
            msg.innerText = `${activeHundred}回達成：命の鼓動が激しく刻まれている…！`;
        }
    } else {
        msg.innerText = "無心で叩け…！";
    }

    if (current >= 100) {
        egg.style.transform = `rotate(${(current % 20) - 10}deg)`;
    }

    return isHit;
}

// 誕生処理
function hatchChick() {
    playFanfare();
    
    const rand = Math.random() * 100;
    let pool = [];
    if (rand < 5) pool = chickTypes.filter(c => c.rarity === "SSR");
    else if (rand < 30) pool = chickTypes.filter(c => c.rarity === "SR");
    else pool = chickTypes.filter(c => c.rarity === "N");
    
    const result = pool[Math.floor(Math.random() * pool.length)];
    collection.add(result.id);

    saveGameData(); // 達成データも即セーブ

    const modal = document.getElementById("result-modal");
    const rarityLabel = document.getElementById("rarity-label");
    rarityLabel.innerText = `【 ${result.rarity} 】`;
    rarityLabel.className = `rare-${result.rarity}`;
    
    document.getElementById("chick-icon").innerText = result.emoji;
    document.getElementById("chick-name").innerText = result.name;
    document.getElementById("chick-desc").innerText = result.desc;
    
    modal.classList.add("active");
    document.getElementById("col-count").innerText = collection.size;
}

// 図鑑表示
function openZukan() {
    const list = document.getElementById("zukan-list");
    list.innerHTML = "";

    chickTypes.forEach(chick => {
        const isDiscovered = collection.has(chick.id);
        const item = document.createElement("div");
        item.className = "zukan-item";

        if (isDiscovered) {
            item.innerHTML = `
                <div class="icon">${chick.emoji}</div>
                <div class="info">
                    <div class="no">No.${chick.id}</div>
                    <div class="name rare-${chick.rarity}">[${chick.rarity}] ${chick.name}</div>
                    <div class="desc">${chick.desc}</div>
                </div>
            `;
        } else {
            item.innerHTML = `
                <div class="icon zukan-unknown">❓</div>
                <div class="info zukan-unknown">
                    <div class="no">No.${chick.id}</div>
                    <div class="name">未発見のひよこ</div>
                    <div class="desc">10,000回タップして孵化させよう</div>
                </div>
            `;
        }
        list.appendChild(item);
    });

    document.getElementById("zukan-modal").classList.add("active");
}

function closeZukan() {
    document.getElementById("zukan-modal").classList.remove("active");
}

function resetGame() {
    count = 0;
    currentBgmStage = -1;
    saveGameData();
    document.getElementById("count").innerText = count;
    document.getElementById("message").innerText = "無心で叩け…！";
    document.getElementById("result-modal").classList.remove("active");
    document.body.style.backgroundColor = "#222";
    updateBGMStage();
}
</script>
