            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #egg {

            display: inline-block;
        }
        #egg:active {

            color: #ffeb3b;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.active {
            display: flex;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #chick-icon {
            font-size: 130px;
            margin: 10px 0;

<body onclick="initAudioOnce()">

        <button onclick="clearAllSaveData()" style="background:#dc2626;">💥 全データリセット</button>
    </div>

// 実際に所持しているひよこの「種類数」を正確に取得する関数
function getCollectedTypeCount() {
    return Object.keys(collectionCounts).filter(id => collectionCounts[id] > 0).length;
}

function updateCollectionDisplay() {
    const collectedTypes = getCollectedTypeCount();
    document.getElementById("col-count").innerText = collectedTypes;
    document.getElementById("zukan-modal-count").innerText = collectedTypes;
}

function saveGameData() {
    const saveData = { count: count, collectionCounts: collectionCounts };
    localStorage.setItem("kuso_egg_save", JSON.stringify(saveData));
}

function loadGameData() {
    const dataStr = localStorage.getItem("kuso_egg_save");
    if (dataStr) {
        try {
            const data = JSON.parse(dataStr);
            count = data.count || 0;
            if (data.collectionCounts) {
                collectionCounts = data.collectionCounts;
            } else if (data.collection && Array.isArray(data.collection)) {
                collectionCounts = {};
                data.collection.forEach(id => { collectionCounts[id] = 1; });
            }
        } catch(e) {}
    }
    
    document.getElementById("count").innerText = count;
    updateCollectionDisplay();
    updateMilestoneMessage(count - 1, count);
}

function stopBGM() {
    if (bgmTimer) {
        clearInterval(bgmTimer);
        bgmTimer = null;
    }
}

function resetCurrentGame() {
    count = 0;
    currentBgmStage = -1;
    saveGameData();
    document.getElementById("count").innerText = count;
    document.getElementById("message").innerText = "カウントをリセットしました！";
    document.body.style.backgroundColor = "#222";
    stopBGM();
    if (audioCtx) updateBGMStage();
}

function clearAllSaveData() {
    const result = confirm("本当にリセットしますか？");
    if (!result) return;

    localStorage.removeItem("kuso_egg_save");
    count = 0;
    collectionCounts = {};
    currentBgmStage = -1;
    document.getElementById("count").innerText = 0;
    updateCollectionDisplay();
    document.getElementById("message").innerText = "全データを初期化しました！";
    document.body.style.backgroundColor = "#222";
    stopBGM();
    if (audioCtx) updateBGMStage();
}

function initAudioOnce() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        updateBGMStage();
    } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function updateBGMStage() {
    if (!audioCtx) return;

    let newStage = Math.floor(count / 1000);
    if (newStage > 9) newStage = 9;

    if (newStage !== currentBgmStage) {
        currentBgmStage = newStage;
        startBGMByStage(currentBgmStage);
    }
}

const noteFreqs = {
    'C2': 65.41,  'D2': 73.42,  'E2': 82.41,  'F2': 87.31,  'G2': 98.00,  'G#2': 103.83, 'A2': 110.00, 'B2': 123.47,
    'C3': 130.81, 'D3': 146.83, 'Eb3': 155.56, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00,  'G#3': 207.65, 'A3': 220.00, 'B3': 246.94,
    'C4': 261.63, 'D4': 293.66, 'Eb4': 311.13, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00,  'G#4': 415.30, 'A4': 440.00, 'B4': 493.88,
    'C5': 523.25, 'D5': 587.33, 'Eb5': 622.25, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99,  'G#5': 830.61, 'A5': 880.00, 'B5': 987.77,
    'C6': 1046.50, 'R': 0
};

const bgmMelodies = [
    ["C4","E4","G4","E4", "D4","F4","A4","F4", "E4","G4","B4","G4", "C5","G4","E4","C4"],
    ["C4","C4","G4","G4", "A4","A4","G4","R",  "F4","F4","E4","E4", "D4","D4","C4","R"],
    ["E4","G4","C5","E5", "D5","B4","G4","D4", "C5","E4","A4","C5", "B4","G4","E4","G4"]
];

const grandSerenadeMelody = [
    "E5", "G5", "C6", "B5", "A5", "G5", "F5", "E5",
    "D5", "F5", "A5", "G5", "F5", "E5", "D5", "C5",
    "A4", "C5", "E5", "D5", "C5", "B4", "A4", "G4",
    "C5", "E5", "G5", "F5", "E5", "D5", "B4", "C5"
];

function playSustainedNote(freq, type, duration, gainVal = 0.1) {
    if (!audioCtx || freq === 0) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(gainVal, audioCtx.currentTime + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playDrumNoise(duration) {
    if (!audioCtx) return;
    let bufferSize = audioCtx.sampleRate * duration;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
    }
    let noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    let gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    noise.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
}

function startBGMByStage(stage) {
    stopBGM();
    
    if (stage >= 9) {
        document.body.style.backgroundColor = "#0b1325";
    } else {
        document.body.style.backgroundColor = "#222";
    }

    let speed = (stage >= 9) ? 480 : Math.max(120, 260 - stage * 15); 
    let step = 0;

    bgmTimer = setInterval(() => {
        if (!audioCtx) return;

        if (stage >= 9) {
            let noteStr = grandSerenadeMelody[step % grandSerenadeMelody.length];
            let freq = noteFreqs[noteStr] || 0;

            playSustainedNote(freq, 'triangle', 0.8, 0.14);

            if (freq > 0) {
                playSustainedNote(freq * 0.75, 'sawtooth', 0.7, 0.04);
            }

            if (step % 2 === 0) {
                let baseFreq = freq ? freq / 2 : noteFreqs['C2'];
                playSustainedNote(baseFreq, 'triangle', 1.2, 0.22);
            }

            if (step % 4 === 0) {
                playDrumNoise(0.12);
            }
        } else {
            let melodyIdx = 0;
            if (stage >= 3) melodyIdx = 1;
            if (stage >= 6) melodyIdx = 2;

            const melody = bgmMelodies[melodyIdx];
            let noteStr = melody[step % melody.length];
            let freq = noteFreqs[noteStr] || 0;

            if (freq > 0) {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (speed/1000) * 0.95);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + (speed/1000));
            }

            if (stage >= 2 && step % 2 === 0) {
                let baseFreq = freq ? freq / 2 : noteFreqs['C3'];
                playSustainedNote(baseFreq, 'triangle', (speed * 1.8) / 1000, 0.08);
            }
            if (stage >= 4 && step % 2 === 1) playDrumNoise(0.05);
        }

        step++;
    }, speed);
}

function playTapSound(freq = 400) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

function playMilestoneSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523, 659, 783, 1046];
    notes.forEach((freq, index) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + index * 0.07);
        gain.gain.setValueAtTime(0.12, now + index * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.07 + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.07);
        osc.stop(now + index * 0.07 + 0.22);
    });
}

function playFanfare() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523, 659, 783, 1046, 1318, 1567];
    notes.forEach((freq, index) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + index * 0.1);
        gain.gain.setValueAtTime(0.2, now + index * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.1);
        osc.stop(now + index * 0.1 + 0.55);
    });
}

function tapEgg() {
    initAudioOnce();
    addCount(1);
}

function addCount(num) {
    if (count >= targetCount) return;

    const prevCount = count;
    count += num;
    if (count > targetCount) count = targetCount;
    document.getElementById("count").innerText = count;

    saveGameData();
    updateBGMStage();

    const isMilestone = updateMilestoneMessage(prevCount, count);

    if (isMilestone) {
        playMilestoneSound();
    } else {
        playTapSound(300 + (count % 200));
    }

    if (count >= targetCount) {
        hatchChick();
    }
}

function updateMilestoneMessage(prevCount, currentCount) {
    let milestoneHit = false;
    for (let m = 100; m <= 10000; m += 100) {
        if (prevCount < m && currentCount >= m) {
            if (milestoneMessages[m]) {
                document.getElementById("message").innerText = milestoneMessages[m];
                milestoneHit = true;
            }
        }
    }
    return milestoneHit;
}

function hatchChick() {
    playFanfare();
    
    let chosenChick = null;
    const currentUniqueCount = getCollectedTypeCount();

    if (currentUniqueCount >= 100 && !collectionCounts[101]) {
        chosenChick = chickTypes.find(c => c.id === 101);
    } else {
        const availablePool = chickTypes.filter(c => c.id !== 101);
        const rand = Math.random() * 100;
        let rarityFilter = "N";
        if (rand < 2) rarityFilter = "SSR";
        else if (rand < 15) rarityFilter = "SR";

        let filteredPool = availablePool.filter(c => c.rarity === rarityFilter);
        if (filteredPool.length === 0) filteredPool = availablePool;

        chosenChick = filteredPool[Math.floor(Math.random() * filteredPool.length)];
    }

    collectionCounts[chosenChick.id] = (collectionCounts[chosenChick.id] || 0) + 1;
    saveGameData();

    updateCollectionDisplay();
    document.getElementById("rarity-label").innerText = `[${chosenChick.rarity}]`;
    document.getElementById("rarity-label").className = `rare-${chosenChick.rarity}`;
    document.getElementById("chick-icon").innerText = chosenChick.emoji;
    document.getElementById("chick-name").innerText = chosenChick.name;
    document.getElementById("chick-owned-count").innerText = `所持数: ${collectionCounts[chosenChick.id]} 匹`;
    document.getElementById("chick-desc").innerText = chosenChick.desc;

    const nextBtn = document.getElementById("next-egg-btn");
    nextBtn.disabled = true;
    setTimeout(() => { nextBtn.disabled = false; }, 500);

    document.getElementById("result-modal").classList.add("active");
}

function resetGame() {
    document.getElementById("result-modal").classList.remove("active");
    resetCurrentGame();
}

function openZukan() {
    updateCollectionDisplay();
    const zukanListEl = document.getElementById("zukan-list");
    zukanListEl.innerHTML = "";

    chickTypes.forEach(chick => {
        const isOwned = !!collectionCounts[chick.id] && collectionCounts[chick.id] > 0;
        const item = document.createElement("div");
        item.className = "zukan-item";

        if (isOwned) {
            item.innerHTML = `
                <div class="icon">${chick.emoji}</div>
                <div class="info">
                    <div class="no">No.${chick.id} <span class="rare-${chick.rarity}">[${chick.rarity}]</span></div>
                    <div class="name">${chick.name}<span class="count-tag">x${collectionCounts[chick.id]}</span></div>
                    <div class="desc">${chick.desc}</div>
                </div>
            `;
        } else {
            item.innerHTML = `
                <div class="icon zukan-unknown">❓</div>
                <div class="info zukan-unknown">
                    <div class="no">No.${chick.id} [???]</div>
                    <div class="name">？？？？？</div>
                    <div class="desc">まだ発見されていません</div>
                </div>
            `;
        }
        zukanListEl.appendChild(item);
    });

    document.getElementById("zukan-modal").classList.add("active");
}
