<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クソ連打！奇跡のたまご🥚</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px 10px 40px 10px;
            user-select: none;
            overflow-y: auto;
            transition: background-color 1s ease;
        }
        #container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            color: #ffeb3b;
            margin-bottom: 10px;
        }
        #counter {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }
        #egg-container {
            position: relative;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #egg {
            font-size: 110px;
            transition: transform 0.05s ease;
            display: inline-block;
        }
        #egg:active {
            transform: scale(0.9);
        }
        #message {
            min-height: 50px;
            color: #ffeb3b;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.active {
            display: flex;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #chick-icon {
            font-size: 130px;
            margin: 10px 0;
            filter: drop-shadow(0 0 20px #fff);
        }
        .rare-GOD { color: #ff00ff; text-shadow: 0 0 15px #00ffff; }
        .rare-SSR { color: #ffd700; text-shadow: 0 0 10px #ff0000; }
        .rare-SR { color: #c0c0c0; text-shadow: 0 0 5px #00ffff; }
        .rare-N { color: #ffffff; }
        
        button {
            padding: 10px 18px;
            font-size: 14px;
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        button:active {
            opacity: 0.8;
        }

        #btn-area {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        #collection-summary {
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 15px;
        }

        #game-description {
            margin-top: 25px;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            text-align: left;
            font-size: 13px;
            line-height: 1.6;
            color: #ddd;
        }
        #game-description h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #ffeb3b;
            font-size: 15px;
            text-align: center;
        }
        
        #zukan-list {
            width: 85%;
            max-height: 55vh;
            overflow-y: auto;
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            text-align: left;
            margin: 10px 0 15px 0;
        }
        .zukan-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;

        }
        .zukan-item .icon { font-size: 40px; margin-right: 15px; width: 50px; text-align: center; }

</head>
<body onclick="initAudioOnce()">

<div id="container">
    <h1>クソ連打！奇跡のたまご🥚</h1>
    <div id="counter">TAP: <span id="count">0</span> / 10000</div>
    
    <div id="egg-container" onclick="tapEgg()">
        <div id="egg">🥚</div>
    </div>
    
    <div id="message">画面を叩いて音を鳴らせ！</div>

    <!-- リセット＆デバッグボタン類 -->
    <div id="btn-area">
        <button onclick="addCount(100)" style="background:#555;">[デバッグ] +100タップ</button>
        <button onclick="resetCurrentGame()" style="background:#d97706;">🔄 タップ数をリセット</button>
        <button onclick="clearAllSaveData()" style="background:#dc2626;">💥 全データリセット</button>
    </div>

    <div id="collection-summary">
        <h3>図鑑達成率: <span id="col-count">0</span>/101</h3>

    </div>

    <!-- ゲーム説明書き -->
    <div id="game-description">
        <h3>💡 あそびかた</h3>
        ・たまごを10,000回タップすると、中からひよこが生まれます！<br>
        ・誕生したひよこは図鑑にコレクションされていきます。<br>
        ・ひよこの種類は全101種類！100種類集めると特別な101番目が…？<br>
        ・9000タップからは超壮大なオーケストラ風ラストBGMに変化！コンプリートを目指そう！
    </div>
</div>

<!-- 誕生モーダル -->
<div id="result-modal" class="modal">
    <h1 style="color:#ff0; font-size: 32px; margin: 0;">🎉 生 誕 🎉</h1>
    <div id="rarity-label" style="font-size: 22px; font-weight: bold; margin-top: 5px;"></div>
    <div id="chick-icon">🐥</div>
    <h2 id="chick-name" style="margin: 5px 0;">普通のひよこ</h2>
    <p id="chick-desc" style="color: #ccc; max-width: 85%; font-size: 14px; line-height: 1.4;"></p>
    <button onclick="resetGame()">次のクソ卵を温める</button>
</div>

<!-- 図鑑一覧モーダル -->
<div id="zukan-modal" class="modal">
    <h2 style="margin: 0; color: #ffeb3b;">🐥 ひよこ図鑑 🐥</h2>
    <div id="zukan-status" style="margin-top: 5px; color: #aaa; font-weight: bold;">集めたひよこ: <span id="zukan-modal-count">0</span> / 101 匹</div>
    <div id="zukan-list"></div>
    <button onclick="closeZukan()">閉じる</button>
</div>

<script>
let count = 0;
const targetCount = 10000;
let audioCtx = null;
let bgmTimer = null;
let currentBgmStage = -1;

const totalChickCount = 101;
const chickTypes = generateChickDatabase();
let collection = new Set();

window.onload = function() {
    loadGameData();
};

function generateChickDatabase() {
    const list = [];
    const prefixes = [
        "普通の", "光の", "闇の", "虚無の", "黄金の", "マッチョな", "メカ", "社畜", "宇宙", "虚弱な",
        "覚醒した", "たそがれの", "伝説の", "インテリ", "限界", "ニート", "爆音の", "透明な", "ダンディな", "社外取締役"
    ];
    const baseNames = ["ひよこ", "ピヨ", "トリ", "チキン", "フェニックス"];
    
    const personalityTraits = [
        "毎朝4時に起きて筋トレをしているが体型は変わらない。",
        "口癖は『まあ知らんけど』で議論をうやむやにする。",

        "鳴き声が『ピヨ』ではなく『ソノ件デスガ』である。",
        "バッテリー残量が常に3%しかない次世代型ピヨ。",
        "連打された衝撃で自分が鶏だったか悩み始めた。",
        "プロテインを水なしで飲むストイックな性格。",
        "裏で株式投資をしており含み損に苦しんでいる。",
        "鳴き声の周波数が高すぎてコウモリにしか届かない。",
        "休日はカフェでノートPCを開き何もしない。",
        "抜け毛を集めて小さなクッションを作ろうとしている。",
        "『ピヨ』の発音に異常なこだわりを持っている。",
        "見つめると照れて卵に戻ろうとするシャイな奴。",
        "無課金勢の味方で期待されないと喜ぶ。",
        "太平洋を自力で泳ぎ渡る夢を持っている。",
        "連打してくれた指の温もりを生涯忘れない。",
        "悟りをひらいておりどんな扱いにも動じない。",
        "生まれた瞬間に『次回作にご期待ください』と言いかけた。"
    ];

    for (let i = 1; i <= 100; i++) {
        let rarity = "N";
        if (i > 70) rarity = "SR";
        if (i > 95) rarity = "SSR";
        
        let emoji = "🐥";
        if (rarity === "SR") emoji = "🐤";
        if (rarity === "SSR") emoji = "🐥✨";
        if (i === 100) emoji = "🦚";

        const name = i === 100 ? "神聖不死鳥ピヨ・ゴッド" : `${prefixes[i % prefixes.length]}${baseNames[i % baseNames.length]}`;
        const trait = personalityTraits[(i - 1) % personalityTraits.length];

        list.push({ id: i, name: name, rarity: rarity, emoji: emoji, desc: trait });
    }

    // 101番目：みずきちゃんひよこ（製作者）
    list.push({
        id: 101,
        name: "みずきちゃんひよこ",
        rarity: "GOD",
        emoji: "👑🐥",
        desc: "【開発者降臨】このクソゲーをこの世に生み出した偉大なる製作者「みずき」。100匹のひよこを集めし真の勇者にしか姿を見せない伝説の中の存在。"
    });

    return list;
}

function saveGameData() {
    const saveData = { count: count, collection: Array.from(collection) };
    localStorage.setItem("kuso_egg_save", JSON.stringify(saveData));
}

function loadGameData() {
    const dataStr = localStorage.getItem("kuso_egg_save");
    if (dataStr) {
        try {
            const data = JSON.parse(dataStr);
            count = data.count || 0;
            collection = new Set(data.collection || []);
        } catch(e) {}
    }
    document.getElementById("count").innerText = count;
    document.getElementById("col-count").innerText = collection.size;
    updateMilestoneMessage(count - 1, count);
}

function resetCurrentGame() {
    count = 0;
    currentBgmStage = -1;
    saveGameData();
    document.getElementById("count").innerText = count;
    document.getElementById("message").innerText = "カウントをリセットしました！";
    document.body.style.backgroundColor = "#222";
    if (audioCtx) updateBGMStage();
}

function clearAllSaveData() {
    localStorage.removeItem("kuso_egg_save");
    count = 0;
    collection.clear();
    currentBgmStage = -1;
    document.getElementById("count").innerText = 0;
    document.getElementById("col-count").innerText = 0;
    document.getElementById("message").innerText = "全データを初期化しました！";
    document.body.style.backgroundColor = "#222";
    if (audioCtx) updateBGMStage();
}

function initAudioOnce() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        updateBGMStage();
    } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function updateBGMStage() {
    if (!audioCtx) return;

    let newStage = Math.floor(count / 1000);
    if (newStage > 9) newStage = 9;

    if (newStage !== currentBgmStage) {
        currentBgmStage = newStage;
        startBGMByStage(currentBgmStage);
    }
}

// 音階テーブル (周波数)
const noteFreqs = {
    'C2': 65.41,  'D2': 73.42,  'E2': 82.41,  'F2': 87.31,  'G2': 98.00,  'G#2': 103.83, 'A2': 110.00, 'B2': 123.47,
    'C3': 130.81, 'D3': 146.83, 'Eb3': 155.56, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00,  'G#3': 207.65, 'A3': 220.00, 'B3': 246.94,
    'C4': 261.63, 'D4': 293.66, 'Eb4': 311.13, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00,  'G#4': 415.30, 'A4': 440.00, 'B4': 493.88,
    'C5': 523.25, 'D5': 587.33, 'Eb5': 622.25, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99,  'G#5': 830.61, 'A5': 880.00, 'B5': 987.77,
    'C6': 1046.50, 'R': 0
};

// 通常メロディ (Stage 0 ~ 8)
const bgmMelodies = [
    ["C4","E4","G4","E4", "D4","F4","A4","F4", "E4","G4","B4","G4", "C5","G4","E4","C4"],
    ["C4","C4","G4","G4", "A4","A4","G4","R",  "F4","F4","E4","E4", "D4","D4","C4","R"],
    ["E4","G4","C5","E5", "D5","B4","G4","D4", "C5","E4","A4","C5", "B4","G4","E4","G4"]
];

// 9000タップ〜 超壮大なオーケストラ風ラストバトルメロディ
const epicMelody = [
    "C4", "Eb4", "G4", "C5", "B4", "G4", "Eb4", "G4",
    "Ab4", "C5", "Eb5", "Ab5", "G5", "Eb5", "C5", "G4",
    "F4", "Ab4", "C5", "F5", "Eb5", "C5", "Ab4", "C5",
    "G4", "B4", "D5", "G5", "G5", "F5", "Eb5", "D5"
];

function play8bitNote(freq, type, duration, gainVal = 0.08) {
    if (!audioCtx || freq === 0) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration * 0.95);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playDrumNoise(duration) {
    if (!audioCtx) return;
    let bufferSize = audioCtx.sampleRate * duration;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
    }
    let noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    let gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    noise.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
}

function startBGMByStage(stage) {
    if (bgmTimer) clearInterval(bgmTimer);
    
    // 9000タップ以降は背景を漆黒×深紅の荘厳な配色に変更
    if (stage >= 9) {
        document.body.style.backgroundColor = "#2b0000";
    } else {
        document.body.style.backgroundColor = "#222";
    }

    let speed = Math.max(110, 260 - stage * 15); 
    let step = 0;

    bgmTimer = setInterval(() => {
        if (!audioCtx) return;

        if (stage >= 9) {
            // === 9000タップ〜 壮大なオーケストラBGM演奏処理 ===
            let noteStr = epicMelody[step % epicMelody.length];
            let freq = noteFreqs[noteStr] || 0;

            // ① 主メロディ：Sawtooth（鋸波）でブラス/ストリングスのような伸びやかな音
            play8bitNote(freq, 'sawtooth', speed / 1000, 0.1);

            // ② ハーモニー（3度上または5度上を重ねて劇的な響きに）
            if (freq > 0) {
                play8bitNote(freq * 1.25, 'sawtooth', speed / 1000, 0.04);
            }

            // ③ 重低音ベース (Bass)
            if (step % 2 === 0) {
                let baseFreq = freq ? freq / 2 : noteFreqs['C2'];
                play8bitNote(baseFreq, 'triangle', (speed * 1.8) / 1000, 0.15);
            }

            // ④ パーカッション（力強いリズム音）
            if (step % 2 === 1) {
                playDrumNoise(0.08);
            }
        } else {
            // === Stage 0 ~ 8 通常のBGM処理 ===
            let melodyIdx = 0;
            if (stage >= 3) melodyIdx = 1;
            if (stage >= 6) melodyIdx = 2;

            const melody = bgmMelodies[melodyIdx];
            let noteStr = melody[step % melody.length];
            let freq = noteFreqs[noteStr] || 0;

            play8bitNote(freq, 'square', speed / 1000, 0.06);

            if (stage >= 2 && step % 2 === 0) {
                let baseFreq = freq ? freq / 2 : noteFreqs['C3'];
                play8bitNote(baseFreq, 'triangle', (speed * 1.8) / 1000, 0.08);
            }

            if (stage >= 4 && step % 2 === 1) {
                playDrumNoise(0.05);
            }
        }

        step++;
    }, speed);
}

function playTapSound(freq = 400) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

function playMilestoneSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523, 659, 783, 1046];
    notes.forEach((freq, index) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + index * 0.07);
        gain.gain.setValueAtTime(0.12, now + index * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.07 + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.07);
        osc.stop(now + index * 0.07 + 0.22);
    });
}

function playFanfare() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523, 659, 783, 1046, 1318, 1567];
    notes.forEach((freq, index) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + index * 0.1);
        gain.gain.setValueAtTime(0.2, now + index * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.1);
        osc.stop(now + index * 0.1 + 0.55);
    });
}

function tapEgg() {
    initAudioOnce();
    addCount(1);
}

function addCount(num) {
    const prevCount = count;
    count += num;
    if (count > targetCount) count = targetCount;
    document.getElementById("count").innerText = count;

    saveGameData();
    updateBGMStage();

    const isMilestone = updateMilestoneMessage(prevCount, count);

    if (isMilestone) {
        playMilestoneSound();
    } else {
        playTapSound(300 + (count % 200));
    }

    if (count >= targetCount) {
        hatchChick();
    }
}

function updateMilestoneMessage(prev, current) {
    const msg = document.getElementById("message");
    const egg = document.getElementById("egg");
    let isHit = false;

    const prevHundred = Math.floor(prev / 100);
    const currHundred = Math.floor(current / 100);

    if (currHundred > prevHundred) {
        isHit = true;
    }

    const activeHundred = currHundred * 100;

    if (activeHundred > 0) {
        if (milestoneMessages[activeHundred]) {
            msg.innerText = milestoneMessages[activeHundred];
        } else {
            msg.innerText = `${activeHundred}回達成：命の鼓動が激しく刻まれている…！`;
        }
    } else {
        msg.innerText = "画面を叩いて音を鳴らせ！";
    }

    if (current >= 100) {
        egg.style.transform = `rotate(${(current % 20) - 10}deg)`;
    }

    return isHit;
}

function hatchChick() {
    playFanfare();
    
    let result;

    let normalCollectedCount = 0;
    for (let i = 1; i <= 100; i++) {
        if (collection.has(i)) normalCollectedCount++;
    }

    if (normalCollectedCount >= 100 && !collection.has(101)) {
        result = chickTypes.find(c => c.id === 101);
    } else {
        const rand = Math.random() * 100;
        let pool = [];
        if (rand < 5) pool = chickTypes.filter(c => c.rarity === "SSR" && c.id <= 100);
        else if (rand < 30) pool = chickTypes.filter(c => c.rarity === "SR" && c.id <= 100);
        else pool = chickTypes.filter(c => c.rarity === "N" && c.id <= 100);
        
        result = pool[Math.floor(Math.random() * pool.length)];
    }

    collection.add(result.id);
    saveGameData();

    const modal = document.getElementById("result-modal");
    const rarityLabel = document.getElementById("rarity-label");
    rarityLabel.innerText = `【 ${result.rarity} 】`;
    rarityLabel.className = `rare-${result.rarity}`;
    
    document.getElementById("chick-icon").innerText = result.emoji;
    document.getElementById("chick-name").innerText = result.name;
    document.getElementById("chick-desc").innerText = result.desc;
    
    modal.classList.add("active");
    document.getElementById("col-count").innerText = collection.size;
}

function openZukan() {
    const list = document.getElementById("zukan-list");
    list.innerHTML = "";

    document.getElementById("zukan-modal-count").innerText = collection.size;

    chickTypes.forEach(chick => {
        const isDiscovered = collection.has(chick.id);
        const item = document.createElement("div");
        item.className = "zukan-item";

        if (isDiscovered) {
            item.innerHTML = `
                <div class="icon">${chick.emoji}</div>
                <div class="info">
                    <div class="no">No.${chick.id}</div>
                    <div class="name rare-${chick.rarity}">[${chick.rarity}] ${chick.name}</div>
                    <div class="desc">${chick.desc}</div>
                </div>
            `;
        } else {
            let reqText = chick.id === 101 ? "No.1〜100コンプリートで解放！" : "10,000回タップして孵化させよう";
            item.innerHTML = `
                <div class="icon zukan-unknown">❓</div>
                <div class="info zukan-unknown">
                    <div class="no">No.${chick.id}</div>
                    <div class="name">未発見のひよこ</div>
                    <div class="desc">${reqText}</div>
                </div>
            `;
        }
        list.appendChild(item);
    });

    document.getElementById("zukan-modal").classList.add("active");
}

function closeZukan() {
    document.getElementById("zukan-modal").classList.remove("active");
}

function resetGame() {
    count = 0;
    currentBgmStage = -1;
    saveGameData();
    document.getElementById("count").innerText = count;
    document.getElementById("message").innerText = "画面を叩いて音を鳴らせ！";
    document.getElementById("result-modal").classList.remove("active");
    document.body.style.backgroundColor = "#222";
    updateBGMStage();
}
</script>
