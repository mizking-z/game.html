<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卵連打クソゲー - 10000回の奇跡</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
            overflow: hidden;
        }
        #container {
            max-width: 500px;
            margin: 0 auto;
        }
        #counter {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }
        #egg-container {
            position: relative;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #egg {
            font-size: 120px;
            transition: transform 0.05s ease;
            display: inline-block;
        }
        #egg:active {
            transform: scale(0.9);
        }
        #message {
            height: 40px;
            color: #ffeb3b;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }
        /* モーダル共通スタイル */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.active {
            display: flex;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #chick-icon {
            font-size: 130px;
            margin: 10px 0;
            filter: drop-shadow(0 0 20px #fff);
        }
        .rare-SSR { color: #ffd700; text-shadow: 0 0 10px #ff0000; }
        .rare-SR { color: #c0c0c0; }
        .rare-N { color: #ffffff; }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* 図鑑エリア */
        #collection-summary {
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
        
        /* 図鑑モーダル内のリスト */
        #zukan-list {
            width: 85%;
            max-height: 60vh;
            overflow-y: auto;
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            text-align: left;
            margin: 15px 0;
        }
        .zukan-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
            padding: 8px 0;
        }
        .zukan-item .icon { font-size: 40px; margin-right: 15px; width: 50px; text-align: center; }
        .zukan-item .info { flex-grow: 1; }
        .zukan-item .name { font-weight: bold; font-size: 16px; }
        .zukan-item .desc { font-size: 12px; color: #aaa; margin-top: 3px; }
        .zukan-unknown { color: #555; }
    </style>
</head>
<body>

<div id="container">
    <h1>神聖なる卵連打</h1>
    <div id="counter">TAP: <span id="count">0</span> / 10000</div>
    
    <div id="egg-container" onclick="tapEgg()">
        <div id="egg">🥚</div>
    </div>
    
    <div id="message">タップして命を吹き込め…</div>

    <!-- デバッグ用：1000タップスキップボタン -->
    <button onclick="addCount(1000)" style="background:#555; font-size:12px; padding:5px;">[デバッグ] +1000タップ</button>

    <div id="collection-summary">
        <h3>図鑑達成率: <span id="col-count">0</span>/100</h3>
        <button onclick="openZukan()">📖 図鑑を見る</button>
    </div>
</div>

<!-- 誕生モーダル（10000回達成時） -->
<div id="result-modal" class="modal">
    <h1 style="color:#ff0; font-size: 32px; margin: 0;">🎉 生 誕 🎉</h1>
    <div id="rarity-label" style="font-size: 22px; font-weight: bold; margin-top: 5px;"></div>
    <div id="chick-icon">🐥</div>
    <h2 id="chick-name" style="margin: 5px 0;">普通のひよこ</h2>
    <p id="chick-desc" style="color: #ccc; max-width: 80%; font-size: 14px;"></p>
    <button onclick="resetGame()">次の卵を温める</button>
</div>

<!-- 図鑑一覧モーダル -->
<div id="zukan-modal" class="modal">
    <h2 style="margin: 0; color: #ffeb3b;">🐥 ひよこ図鑑 🐥</h2>
    <div id="zukan-list"></div>
    <button onclick="closeZukan()">閉じる</button>
</div>

<script>
let count = 0;
const targetCount = 10000;
let audioCtx = null;

// ひよこ図鑑データ（全100種類を生成するロジック）
const chickTypes = generateChickDatabase();
let collection = new Set();

function generateChickDatabase() {
    const list = [];
    const baseNames = ["ひよこ", "ピヨ", "鳥", "チキン", "フェニックス"];
    const prefixes = ["普通の", "光の", "闇の", "虚無の", "黄金の", "マッチョな", "メカ", "社畜", "宇宙", "虚弱な"];
    
    for (let i = 1; i <= 100; i++) {
        let rarity = "N";
        if (i > 70) rarity = "SR";
        if (i > 95) rarity = "SSR";
        
        let emoji = "🐥";
        if (rarity === "SR") emoji = "🐤";
        if (rarity === "SSR") emoji = "🐥✨";
        if (i === 100) emoji = "🦚";

        list.push({
            id: i,
            name: `${prefixes[i % prefixes.length]}${baseNames[i % baseNames.length]} (No.${i})`,
            rarity: rarity,
            emoji: emoji,
            desc: `図鑑番号${i}番。特に意味はない解説テキスト。`
        });
    }
    return list;
}

// 簡易Web Audio API（音源）
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startBGM();
    }
}

// BGM（ループ音）
function startBGM() {
    const notes = [261.63, 293.66, 329.63, 349.23];
    let step = 0;
    setInterval(() => {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
        step++;
    }, 500);
}

// 通常タップ音
function playTapSound(freq = 400) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

// 節目の特別効果音（ピロリン♪）
function playMilestoneSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
    notes.forEach((freq, index) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + index * 0.08);
        gain.gain.setValueAtTime(0.15, now + index * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.08);
        osc.stop(now + index * 0.08 + 0.25);
    });
}

// 生誕ファンファーレ
function playFanfare() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, index) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + index * 0.12);
        gain.gain.setValueAtTime(0.2, now + index * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.12 + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.12);
        osc.stop(now + index * 0.12 + 0.5);
    });
}

function tapEgg() {
    initAudio();
    addCount(1);
}

function addCount(num) {
    const prevCount = count;
    count += num;
    if (count > targetCount) count = targetCount;
    document.getElementById("count").innerText = count;

    // 節目チェック
    const isMilestone = checkMilestones(prevCount, count);
    
    if (isMilestone) {
        playMilestoneSound();
    } else {
        playTapSound(300 + (count % 200));
    }

    if (count >= targetCount) {
        hatchChick();
    }
}

// 節目判定とテキスト変更
function checkMilestones(prev, current) {
    const milestones = [10, 50, 100, 200, 500, 1000, 2000, 5000, 8000, 9999];
    const msg = document.getElementById("message");
    const egg = document.getElementById("egg");
    let hit = false;

    for (let m of milestones) {
        if (prev < m && current >= m) {
            hit = true;
            break;
        }
    }

    if (current >= 10 && current < 50) msg.innerText = "10回：少し温かくなってきた気がする。";
    if (current >= 50 && current < 100) msg.innerText = "50回：気のせいだった。まだただの卵だ。";
    if (current >= 100 && current < 200) { msg.innerText = "100回：ヒビが入った…？いや、ホコリだった。"; egg.style.transform = "rotate(5deg)"; }
    if (current >= 200 && current < 500) msg.innerText = "200回：画面をタップする作業に疑問を感じ始める頃。";
    if (current >= 500 && current < 1000) { msg.innerText = "500回：卵「あ、そこ気持ちいいです」"; }
    if (current >= 1000 && current < 2000) { msg.innerText = "1000回：自我が芽生え始めている。"; document.body.style.backgroundColor = "#1a2421"; }
    if (current >= 2000 && current < 5000) msg.innerText = "2000回：指の疲労感＝命の重み。";
    if (current >= 5000 && current < 8000) { msg.innerText = "5000回：折り返し地点。背景が妙な威圧感を放ち始める。"; document.body.style.backgroundColor = "#331a24"; }
    if (current >= 8000 && current < 9999) msg.innerText = "8000回：もうすぐ産まれる！がんばれ！";
    if (current >= 9999) msg.innerText = "9999回：ラスト１タップ！！！";

    return hit;
}

// 誕生処理
function hatchChick() {
    playFanfare();
    
    // ガチャ判定（SSR: 5%, SR: 25%, N: 70%）
    const rand = Math.random() * 100;
    let pool = [];
    if (rand < 5) pool = chickTypes.filter(c => c.rarity === "SSR");
    else if (rand < 30) pool = chickTypes.filter(c => c.rarity === "SR");
    else pool = chickTypes.filter(c => c.rarity === "N");
    
    const result = pool[Math.floor(Math.random() * pool.length)];
    collection.add(result.id);

    // 誕生画面表示
    const modal = document.getElementById("result-modal");
    const rarityLabel = document.getElementById("rarity-label");
    rarityLabel.innerText = `【 ${result.rarity} 】`;
    rarityLabel.className = `rare-${result.rarity}`;
    
    document.getElementById("chick-icon").innerText = result.emoji;
    document.getElementById("chick-name").innerText = result.name;
    document.getElementById("chick-desc").innerText = result.desc;
    
    modal.classList.add("active");
    document.getElementById("col-count").innerText = collection.size;
}

// 図鑑を表示
function openZukan() {
    const list = document.getElementById("zukan-list");
    list.innerHTML = "";

    chickTypes.forEach(chick => {
        const isDiscovered = collection.has(chick.id);
        const item = document.createElement("div");
        item.className = "zukan-item";

        if (isDiscovered) {
            item.innerHTML = `
                <div class="icon">${chick.emoji}</div>
                <div class="info">
                    <div class="name <span class='rare-${chick.rarity}'>[${chick.rarity}] ${chick.name}</div>
                    <div class="desc">${chick.desc}</div>
                </div>
            `;
        } else {
            item.innerHTML = `
                <div class="icon zukan-unknown">❓</div>
                <div class="info zukan-unknown">
                    <div class="name">No.${chick.id} 未発見</div>
                    <div class="desc">10,000回タップして孵化させよう</div>
                </div>
            `;
        }
        list.appendChild(item);
    });

    document.getElementById("zukan-modal").classList.add("active");
}

function closeZukan() {
    document.getElementById("zukan-modal").classList.remove("active");
}

function resetGame() {
    count = 0;
    document.getElementById("count").innerText = count;
    document.getElementById("message").innerText = "再びタップして命を吹き込め…";
    document.getElementById("result-modal").classList.remove("active");
    document.body.style.backgroundColor = "#222";
}
</script>

</body>
</html>
