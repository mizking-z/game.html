<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卵連打クソゲー - 10000回の奇跡</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
            overflow: hidden;
            transition: background-color 1s ease;
        }
        #container {
            max-width: 500px;
            margin: 0 auto;
        }
        #counter {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }
        #egg-container {
            position: relative;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #egg {
            font-size: 120px;
            transition: transform 0.05s ease;
            display: inline-block;
        }
        #egg:active {
            transform: scale(0.9);
        }
        #message {
            height: 50px;
            color: #ffeb3b;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }
        /* モーダル共通スタイル */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.active {
            display: flex;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #chick-icon {
            font-size: 130px;
            margin: 10px 0;
            filter: drop-shadow(0 0 20px #fff);
        }
        .rare-SSR { color: #ffd700; text-shadow: 0 0 10px #ff0000; }
        .rare-SR { color: #c0c0c0; text-shadow: 0 0 5px #00ffff; }
        .rare-N { color: #ffffff; }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* 図鑑エリア */
        #collection-summary {
            margin-top: 15px;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
        
        /* 図鑑モーダル内のリスト */
        #zukan-list {
            width: 85%;
            max-height: 60vh;
            overflow-y: auto;
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            text-align: left;
            margin: 15px 0;
        }
        .zukan-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
            padding: 10px 0;
        }
        .zukan-item .icon { font-size: 40px; margin-right: 15px; width: 50px; text-align: center; }
        .zukan-item .info { flex-grow: 1; }
        .zukan-item .name { font-weight: bold; font-size: 15px; }
        .zukan-item .desc { font-size: 12px; color: #ccc; margin-top: 4px; line-height: 1.3; }
        .zukan-unknown { color: #555; }
    </style>
</head>
<body>

<div id="container">
    <h1>神聖なる卵連打</h1>
    <div id="counter">TAP: <span id="count">0</span> / 10000</div>
    
    <div id="egg-container" onclick="tapEgg()">
        <div id="egg">🥚</div>
    </div>
    
    <div id="message">タップして命を吹き込め…</div>

    <!-- デバッグ用：1000タップスキップボタン -->
    <button onclick="addCount(1000)" style="background:#555; font-size:12px; padding:5px;">[デバッグ] +1000タップ</button>

    <div id="collection-summary">
        <h3>図鑑達成率: <span id="col-count">0</span>/100</h3>
        <button onclick="openZukan()">📖 図鑑を見る</button>
    </div>
</div>

<!-- 誕生モーダル（10000回達成時） -->
<div id="result-modal" class="modal">
    <h1 style="color:#ff0; font-size: 32px; margin: 0;">🎉 生 誕 🎉</h1>
    <div id="rarity-label" style="font-size: 22px; font-weight: bold; margin-top: 5px;"></div>
    <div id="chick-icon">🐥</div>
    <h2 id="chick-name" style="margin: 5px 0;">普通のひよこ</h2>
    <p id="chick-desc" style="color: #ccc; max-width: 85%; font-size: 14px; line-height: 1.4;"></p>
    <button onclick="resetGame()">次の卵を温める</button>
</div>

<!-- 図鑑一覧モーダル -->
<div id="zukan-modal" class="modal">
    <h2 style="margin: 0; color: #ffeb3b;">🐥 ひよこ図鑑 🐥</h2>
    <div id="zukan-list"></div>
    <button onclick="closeZukan()">閉じる</button>
</div>

<script>
let count = 0;
const targetCount = 10000;
let audioCtx = null;
let bgmTimer = null;
let isGrandBGM = false;

// 100種類のひよこデータベース生成
const chickTypes = generateChickDatabase();
let collection = new Set();

function generateChickDatabase() {
    const list = [];
    
    const prefixes = [
        "普通の", "光の", "闇の", "虚無の", "黄金の", "マッチョな", "メカ", "社畜", "宇宙", "虚弱な",
        "覚醒した", "たそがれの", "伝説の", "インテリ", "限界", "ニート", "爆音の", "透明な", "ダンディな", "社外取締役"
    ];
    const baseNames = ["ひよこ", "ピヨ", "トリ", "チキン", "フェニックス"];
    
    const personalityTraits = [
        "毎朝4時に起きて筋トレをしているが、体型はまったく変わらない。",
        "口癖は『まあ知らんけど』。議論をうやむやにするプロ。",
        "夜中に自分の前足（翼）を見つめて深呼吸するのが日課。",
        "キーボードの『Enter』だけやたら強く叩くタイプ。",
        "実は卵の殻の中にエアコンを完備していたらしい。",
        "鳴き声が『ピヨ』ではなく『ソノ件デスガ』である。",
        "自称・次世代型ピヨ。バッテリー残量が常に3%しかない。",
        "連打された衝撃で記憶を失い、自分が鶏だったか迷っている。",
        "プロテインを水なしで飲むストイックなメンタルを持つ。",
        "実は裏で株式投資をしており、含み損に苦しんでいる。",
        "鳴き声の周波数が高すぎて一部のコウモリにしか届かない。",
        "休日はカフェでノートPCを開き、何も入力せずにドトールにいる。",
        "自分の羽毛の抜け毛で小さなクッションを作ろうとしている。",
        "『ピヨ』のアクセントに異常なこだわりを持っている。",
        "見つめると照れて卵に戻ろうとするシャイな性格。",
        "無課金勢の味方。何も期待しないで接すると喜ぶ。",
        "夢は大きく太平洋を自力で泳ぎ渡ること（泳げない）。",
        "連打してくれた指の温もりを生涯忘れないと誓っている。",
        "悟りを開いており、どんな扱いを受けても動じない。",
        "生まれた瞬間に『次回作にご期待ください』と言い残しそうになった。"
    ];

    for (let i = 1; i <= 100; i++) {
        let rarity = "N";
        if (i > 70) rarity = "SR";
        if (i > 95) rarity = "SSR";
        
        let emoji = "🐥";
        if (rarity === "SR") emoji = "🐤";
        if (rarity === "SSR") emoji = "🐥✨";
        if (i === 100) emoji = "🦚"; // 100番目の超レア

        const name = i === 100 ? "神聖不死鳥ピヨ・ゴッド (No.100)" : `${prefixes[i % prefixes.length]}${baseNames[i % baseNames.length]} (No.${i})`;
        const trait = personalityTraits[(i - 1) % personalityTraits.length];
        const desc = `【特徴】${trait}（レア度: ${rarity}）`;

        list.push({
            id: i,
            name: name,
            rarity: rarity,
            emoji: emoji,
            desc: desc
        });
    }
    return list;
}

// 簡易Web Audio API（音源）
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startBGM();
    }
}

// BGM（通常ループ／9000回以降は壮大化）
function startBGM() {
    if (bgmTimer) clearInterval(bgmTimer);
    
    let step = 0;
    bgmTimer = setInterval(() => {
        if (!audioCtx) return;
        
        if (!isGrandBGM) {
            // 通常BGM（単調でシュールなピコピコ音）
            const notes = [261.63, 293.66, 329.63, 349.23];
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.45);
        } else {
            // 9000回以降：壮大なオーケストラ風和音BGM（ドミソ＋高音）
            const chords = [
                [261.63, 329.63, 392.00, 523.25], // C Major
                [220.00, 261.63, 329.63, 440.00], // A minor
                [174.61, 220.00, 261.63, 349.23], // F Major
                [196.00, 246.94, 293.66, 392.00]  // G Major
            ];
            const currentChord = chords[step % chords.length];
            currentChord.forEach(freq => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.75);
            });
        }
        step++;
    }, isGrandBGM ? 800 : 500);
}

// 通常タップ音
function playTapSound(freq = 400) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

// 節目の特別効果音（ピロリン♪）
function playMilestoneSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, index) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + index * 0.07);
        gain.gain.setValueAtTime(0.12, now + index * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.07 + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.07);
        osc.stop(now + index * 0.07 + 0.22);
    });
}

// 生誕ファンファーレ
function playFanfare() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
    notes.forEach((freq, index) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + index * 0.1);
        gain.gain.setValueAtTime(0.2, now + index * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.1);
        osc.stop(now + index * 0.1 + 0.55);
    });
}

function tapEgg() {
    initAudio();
    addCount(1);
}

function addCount(num) {
    const prevCount = count;
    count += num;
    if (count > targetCount) count = targetCount;
    document.getElementById("count").innerText = count;

    // 9000回超えでBGM変化
    if (count >= 9000 && !isGrandBGM) {
        isGrandBGM = true;
        document.body.style.backgroundColor = "#4a0000"; // 背景も神々しい赤黒に
        startBGM();
    }

    // 節目チェック
    const isMilestone = checkMilestones(prevCount, count);
    
    if (isMilestone) {
        playMilestoneSound();
    } else {
        playTapSound(300 + (count % 200));
    }

    if (count >= targetCount) {
        hatchChick();
    }
}

// 節目判定とメッセージ（10、50、100以降は100刻み）
function checkMilestones(prev, current) {
    const msg = document.getElementById("message");
    const egg = document.getElementById("egg");
    let hit = false;

    // 節目通過判定
    if (prev < 10 && current >= 10) hit = true;
    if (prev < 50 && current >= 50) hit = true;
    if (current >= 100) {
        const prevHundred = Math.floor(prev / 100);
        const currHundred = Math.floor(current / 100);
        if (currHundred > prevHundred) hit = true;
    }

    // 固有メッセージ＆演出
    if (current < 10) {
        msg.innerText = "タップして命を吹き込め…";
    } else if (current < 50) {
        msg.innerText = "10回：ほんのり卵が温かくなってきた。";
    } else if (current < 100) {
        msg.innerText = "50回：気のせいだった。まだただの冷たい卵だ。";
    } else {
        const hundred = Math.floor(current / 100) * 100;
        
        // 100回ごとのシュールメッセージ群
        const messages = {
            100: "100回：ヒビが入った…？いや、ホコリだった。",
            200: "200回：連打する指に微かな疑問を感じ始める。",
            300: "300回：卵の奥から小さく『無駄だよ』と聞こえた気がした。",
            400: "400回：画面の脂汚れが気になり出す頃合い。",
            500: "500回：卵「あ、そこ気持ちいいです」",
            600: "600回：指の関節が自己主張を始めてきた。",
            700: "700回：卵がわずかに左右に揺れた。気のせいかもしれない。",
            800: "800回：まだ8%しか温まっていないという絶望。",
            900: "900回：もうすぐ1000！特に何もないけど！",
            1000: "1000回：自我が目覚めかけたが思いとどまった。",
            1500: "1500回：連打のテンポにグルーヴ感が生まれ始める。",
            2000: "2000回：指の疲労感＝命の重み。",
            3000: "3000回：卵の中で何かがYouTubeを見ている気配。",
            4000: "4000回：指先から不思議な波動が出始める。",
            5000: "5000回：折り返し地点！背景に妙なプレッシャーが漂う。",
            6000: "6000回：ここから先は精神力とタップ力の勝負。",
            7000: "7000回：卵殻の内部でタンパク質の再配置が完了。",
            8000: "8000回：産声のウォーミングアップが始まった！",
            9000: "9000回：【覚醒】世界が震え、BGMが神々しくなる！",
            9500: "9500回：ラストスパート！殻が限界を迎えている！",
            9900: "9900回：あと100タップ！息を呑め！",
            9999: "9999回：ラスト１タップ！！！"
        };

        if (messages[hundred]) {
            msg.innerText = messages[hundred];
        } else {
            msg.innerText = `${hundred}回達成：命の鼓動が激しく刻まれている…！`;
        }

        // 卵の見た目演出
        if (current >= 100) egg.style.transform = `rotate(${(current % 20) - 10}deg)`;
    }

    return hit;
}

// 誕生処理
function hatchChick() {
    playFanfare();
    
    // ガチャ判定（SSR: 5%, SR: 25%, N: 70%）
    const rand = Math.random() * 100;
    let pool = [];
    if (rand < 5) pool = chickTypes.filter(c => c.rarity === "SSR");
    else if (rand < 30) pool = chickTypes.filter(c => c.rarity === "SR");
    else pool = chickTypes.filter(c => c.rarity === "N");
    
    const result = pool[Math.floor(Math.random() * pool.length)];
    collection.add(result.id);

    // 誕生画面表示
    const modal = document.getElementById("result-modal");
    const rarityLabel = document.getElementById("rarity-label");
    rarityLabel.innerText = `【 ${result.rarity} 】`;
    rarityLabel.className = `rare-${result.rarity}`;
    
    document.getElementById("chick-icon").innerText = result.emoji;
    document.getElementById("chick-name").innerText = result.name;
    document.getElementById("chick-desc").innerText = result.desc;
    
    modal.classList.add("active");
    document.getElementById("col-count").innerText = collection.size;
}

// 図鑑を表示
function openZukan() {
    const list = document.getElementById("zukan-list");
    list.innerHTML = "";

    chickTypes.forEach(chick => {
        const isDiscovered = collection.has(chick.id);
        const item = document.createElement("div");
        item.className = "zukan-item";

        if (isDiscovered) {
            item.innerHTML = `
                <div class="icon">${chick.emoji}</div>
                <div class="info">
                    <div class="name rare-${chick.rarity}">[${chick.rarity}] ${chick.name}</div>
                    <div class="desc">${chick.desc}</div>
                </div>
            `;
        } else {
            item.innerHTML = `
                <div class="icon zukan-unknown">❓</div>
                <div class="info zukan-unknown">
                    <div class="name">No.${chick.id} 未発見のひよこ</div>
                    <div class="desc">10,000回タップして孵化させよう</div>
                </div>
            `;
        }
        list.appendChild(item);
    });

    document.getElementById("zukan-modal").classList.add("active");
}

function closeZukan() {
    document.getElementById("zukan-modal").classList.remove("active");
}

function resetGame() {
    count = 0;
    isGrandBGM = false;
    document.getElementById("count").innerText = count;
    document.getElementById("message").innerText = "再びタップして命を吹き込め…";
    document.getElementById("result-modal").classList.remove("active");
    document.body.style.backgroundColor = "#222";
    startBGM();
}
</script>

</body>
</html>
