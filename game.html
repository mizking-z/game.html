<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クソ連打！奇跡のたまご🥚</title>

<style>

body {
    background-color: #222;
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px 10px 40px 10px;
    user-select: none;
    overflow-y: auto;
    transition: background-color 1.5s ease;
}

#container {
    max-width: 500px;
    margin: 0 auto;
}

h1 {
    font-size: 24px;
    color: #ffeb3b;
    margin-bottom: 10px;
}

#counter {
    font-size: 32px;
    font-weight: bold;
    margin: 10px 0;
}

/* =========================
   卵エリア
========================= */

#egg-container {
    position: relative;
    height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

/* =========================
   開始テロップ
========================= */

#start-telop {
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffeb3b;
    font-size: 18px;
    font-weight: bold;
    white-space: nowrap;
    text-shadow: 0 0 8px #ff9800;
    animation: telopBlink 1.2s infinite;
    z-index: 5;
}

@keyframes telopBlink {
    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.35;
    }
}

#start-telop.hidden {
    display: none;
}

/* =========================
   卵本体
========================= */

#egg {
    font-size: 110px;
    transition: transform 0.05s ease;
    display: inline-block;
    position: relative;
    z-index: 1;
}

#egg:active {
    transform: scale(0.9);
}

/* =========================
   卵の揺れ
   1000回ごとに激しくなる
========================= */

#egg-container.shake-1 #egg {
    animation: eggShake1 0.65s infinite;
}

#egg-container.shake-2 #egg {
    animation: eggShake2 0.55s infinite;
}

#egg-container.shake-3 #egg {
    animation: eggShake3 0.45s infinite;
}

#egg-container.shake-4 #egg {
    animation: eggShake4 0.38s infinite;
}

#egg-container.shake-5 #egg {
    animation: eggShake5 0.32s infinite;
}

#egg-container.shake-6 #egg {
    animation: eggShake6 0.27s infinite;
}

#egg-container.shake-7 #egg {
    animation: eggShake7 0.22s infinite;
}

#egg-container.shake-8 #egg {
    animation: eggShake8 0.18s infinite;
}

#egg-container.shake-9 #egg {
    animation: eggShake9 0.13s infinite;
}

#egg-container.shake-10 #egg {
    animation: eggShake10 0.07s infinite;
}

@keyframes eggShake1 {
    0%,100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
}

@keyframes eggShake2 {
    0%,100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
}

@keyframes eggShake3 {
    0%,100% {
        transform: translateX(-2px) rotate(-3deg);
    }

    50% {
        transform: translateX(2px) rotate(3deg);
    }
}

@keyframes eggShake4 {
    0%,100% {
        transform: translateX(-3px) rotate(-4deg);
    }

    50% {
        transform: translateX(3px) rotate(4deg);
    }
}

@keyframes eggShake5 {
    0%,100% {
        transform: translateX(-4px) rotate(-5deg);
    }

    25% {
        transform: translateX(4px) rotate(5deg);
    }

    50% {
        transform: translateX(-4px) rotate(-5deg);
    }

    75% {
        transform: translateX(4px) rotate(5deg);
    }
}

@keyframes eggShake6 {
    0%,100% {
        transform: translate(-5px,0) rotate(-6deg);
    }

    50% {
        transform: translate(5px,0) rotate(6deg);
    }
}

@keyframes eggShake7 {
    0%,100% {
        transform: translate(-6px,2px) rotate(-7deg);
    }

    25% {
        transform: translate(6px,-2px) rotate(7deg);
    }

    50% {
        transform: translate(-6px,2px) rotate(-7deg);
    }

    75% {
        transform: translate(6px,-2px) rotate(7deg);
    }
}

@keyframes eggShake8 {
    0%,100% {
        transform: translate(-7px,3px) rotate(-8deg);
    }

    25% {
        transform: translate(7px,-3px) rotate(8deg);
    }

    50% {
        transform: translate(-7px,3px) rotate(-8deg);
    }

    75% {
        transform: translate(7px,-3px) rotate(8deg);
    }
}

@keyframes eggShake9 {
    0%,100% {
        transform: translate(-9px,3px) rotate(-10deg);
    }

    25% {
        transform: translate(9px,-3px) rotate(10deg);
    }

    50% {
        transform: translate(-9px,3px) rotate(-10deg);
    }

    75% {
        transform: translate(9px,-3px) rotate(10deg);
    }
}

@keyframes eggShake10 {
    0% {
        transform: translate(-10px,0) rotate(-12deg) scale(1);
    }

    20% {
        transform: translate(10px,-3px) rotate(12deg) scale(1.03);
    }

    40% {
        transform: translate(-10px,3px) rotate(-12deg) scale(1);
    }

    60% {
        transform: translate(10px,-3px) rotate(12deg) scale(1.03);
    }

    80% {
        transform: translate(-10px,3px) rotate(-12deg) scale(1);
    }

    100% {
        transform: translate(0,0) rotate(0deg) scale(1);
    }
}

/* =========================
   メッセージ
========================= */

#message {
    min-height: 50px;
    color: #ffeb3b;
    font-size: 16px;
    font-weight: bold;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
}

/* =========================
   モーダル
========================= */

.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.92);
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

.modal.active {
    display: flex;
    animation: popIn 0.3s ease-out;
}

@keyframes popIn {
    0% {
        transform: scale(0.8);
        opacity: 0;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* =========================
   レア度別生誕演出
========================= */

#result-modal {
    overflow: hidden;
}

#chick-icon {
    font-size: 130px;
    margin: 10px 0;
    filter: drop-shadow(0 0 20px #fff);
    position: relative;
    z-index: 5;
}

/* =========================
   N
========================= */

#result-modal.effect-N {
    animation: birthN 0.7s ease-out;
}

@keyframes birthN {
    0% {
        opacity: 0;
        transform: scale(0.7);
    }

    70% {
        transform: scale(1.08);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================
   SR
========================= */

#result-modal.effect-SR {
    background:
        radial-gradient(
            circle,
            rgba(100,220,255,0.35),
            rgba(0,0,0,0.94) 65%
        );

    animation: birthSR 0.9s ease-out;
}

#result-modal.effect-SR #chick-icon {
    animation: chickSR 1.2s infinite alternate;
}

@keyframes birthSR {
    0% {
        opacity: 0;
        transform: scale(0.5);
    }

    50% {
        opacity: 1;
        transform: scale(1.2);
    }

    100% {
        transform: scale(1);
    }
}

@keyframes chickSR {
    from {
        filter:
            drop-shadow(0 0 10px #00ffff)
            drop-shadow(0 0 20px #fff);
    }

    to {
        filter:
            drop-shadow(0 0 25px #00ffff)
            drop-shadow(0 0 45px #fff);
    }
}

/* =========================
   SSR
========================= */

#result-modal.effect-SSR {
    background:
        radial-gradient(
            circle,
            rgba(255,215,0,0.5),
            rgba(255,80,0,0.2),
            rgba(0,0,0,0.96)
        );

    animation: birthSSR 1.2s ease-out;
}

#result-modal.effect-SSR #chick-icon {
    animation: chickSSR 0.8s infinite alternate;
}

@keyframes birthSSR {
    0% {
        opacity: 0;
        transform: scale(0.2) rotate(-20deg);
    }

    40% {
        opacity: 1;
        transform: scale(1.35) rotate(10deg);
    }

    70% {
        transform: scale(0.9) rotate(-5deg);
    }

    100% {
        transform: scale(1) rotate(0deg);
    }
}

@keyframes chickSSR {
    from {
        filter:
            drop-shadow(0 0 10px #ffd700)
            drop-shadow(0 0 25px #ff8c00)
            drop-shadow(0 0 40px #fff);
        transform: scale(1);
    }

    to {
        filter:
            drop-shadow(0 0 25px #ffd700)
            drop-shadow(0 0 50px #ff8c00)
            drop-shadow(0 0 70px #fff);
        transform: scale(1.12);
    }
}

/* =========================
   結果画面
========================= */

#rarity {
    font-size: 42px;
    font-weight: bold;
    margin: 5px 0;
}

#result-text {
    font-size: 20px;
    font-weight: bold;
    margin: 10px 20px;
}

#result-count {
    font-size: 16px;
    margin: 10px 0 20px;
}

#close-button {
    font-size: 18px;
    font-weight: bold;
    padding: 12px 30px;
    border: none;
    border-radius: 10px;
    background: #ffeb3b;
    color: #222;
    cursor: pointer;
}

#close-button:active {
    transform: scale(0.95);
}

/* =========================
   節目メッセージ
========================= */

.milestone {
    animation: milestonePop 0.4s ease-out;
}

@keyframes milestonePop {
    0% {
        transform: scale(0.7);
        opacity: 0;
    }

    70% {
        transform: scale(1.15);
        opacity: 1;
    }

    100% {
        transform: scale(1);
    }
}

</style>
</head>

<body>

<div id="container">

    <h1>クソ連打！奇跡のたまご🥚</h1>

    <div id="counter">
        0回
    </div>

    <div id="egg-container">

        <div id="start-telop">
            〜卵をタップしよう〜
        </div>

        <div id="egg">
            🥚
        </div>

    </div>

    <div id="message">
        卵をひたすらタップしてください。
    </div>

</div>


<!-- =========================
     結果モーダル
========================= -->

<div id="result-modal" class="modal">

    <div id="chick-icon">
        🐣
    </div>

    <div id="rarity">
        N
    </div>

    <div id="result-text">
        ひよこが生まれました！
    </div>

    <div id="result-count">
        10000回タップ達成！
    </div>

    <button id="close-button">
        閉じる
    </button>

</div>


<script>

let count = 0;

const egg = document.getElementById("egg");
const eggContainer = document.getElementById("egg-container");
const counter = document.getElementById("counter");
const message = document.getElementById("message");
const startTelop = document.getElementById("start-telop");

const resultModal = document.getElementById("result-modal");
const chickIcon = document.getElementById("chick-icon");
const rarity = document.getElementById("rarity");
const resultText = document.getElementById("result-text");
const resultCount = document.getElementById("result-count");
const closeButton = document.getElementById("close-button");


/* =========================
   卵タップ
========================= */

eggContainer.addEventListener("click", function() {

    count++;

    /* 開始テロップを消す */
    if (count === 1) {
        startTelop.classList.add("hidden");
    }

    counter.textContent = count + "回";

    updateShake();

    milestoneMessage();

    /* 10000回でひよこ誕生 */
    if (count === 10000) {
        setTimeout(function() {
            showResult();
        }, 300);
    }

});


/* =========================
   卵の揺れ
========================= */

function updateShake() {

    eggContainer.classList.remove(
        "shake-1",
        "shake-2",
        "shake-3",
        "shake-4",
        "shake-5",
        "shake-6",
        "shake-7",
        "shake-8",
        "shake-9",
        "shake-10"
    );

    let stage = Math.floor(count / 1000);

    if (stage > 10) {
        stage = 10;
    }

    if (stage >= 1) {
        eggContainer.classList.add("shake-" + stage);
    }
}


/* =========================
   節目メッセージ
========================= */

function milestoneMessage() {

    let text = "";

    if (count === 10) {
        text = "10回……。まだ何も起きません。";
    }

    else if (count === 50) {
        text = "50回！卵はまだ元気です。";
    }

    else if (count === 100) {
        text = "100回！！そろそろ何か起きる……？";
    }

    else if (count === 200) {
        text = "200回。あなたは何をしているんですか？";
    }

    else if (count === 500) {
        text = "500回！？まだ続けるんですか？";
    }

    else if (count === 1000) {
        text = "1000回達成！！卵が少し揺れ始めました。";
    }

    else if (count === 2000) {
        text = "2000回……。卵の揺れが強くなっています。";
    }

    else if (count === 3000) {
        text = "3000回！！何かがおかしい。";
    }

    else if (count === 5000) {
        text = "5000回！！！！半分です。";
    }

    else if (count === 7000) {
        text = "7000回……。もう後戻りできません。";
    }

    else if (count === 9000) {
        text = "9000回！！！もうすぐです！！！";
    }

    else if (count === 9999) {
        text = "9999回！！！！！！！！";
    }

    else if (count === 10000) {
        text = "奇跡が起きました。";
    }

    if (text !== "") {

        message.textContent = text;

        message.classList.remove("milestone");

        void message.offsetWidth;

        message.classList.add("milestone");
    }
}


/* =========================
   結果表示
========================= */

function showResult() {

    resultModal.classList.remove(
        "effect-N",
        "effect-SR",
        "effect-SSR"
    );

    /*
     * 今回は10000回達成時なのでSSR
     */

    const selectedRarity = "SSR";

    rarity.textContent = selectedRarity;
    resultText.textContent = "奇跡のひよこが誕生しました！！！";
    resultCount.textContent = "10000回タップ達成！";

    chickIcon.textContent = "🐣";

    resultModal.classList.add("active");
    resultModal.classList.add("effect-SSR");

    document.body.style.backgroundColor = "#4a2600";
}


/* =========================
   結果画面を閉じる
========================= */

closeButton.addEventListener("click", function() {

    resultModal.classList.remove(
        "active",
        "effect-N",
        "effect-SR",
        "effect-SSR"
    );

    document.body.style.backgroundColor = "#222";

});


/* =========================
   モーダル外クリック
========================= */

resultModal.addEventListener("click", function(e) {

    if (e.target === resultModal) {

        resultModal.classList.remove(
            "active",
            "effect-N",
            "effect-SR",
            "effect-SSR"
        );

        document.body.style.backgroundColor = "#222";
    }

});

</script>

</body>
</html>
